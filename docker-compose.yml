version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://gitpilot:password@postgres:5432/gitpilot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=gitpilot
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gitpilot
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
